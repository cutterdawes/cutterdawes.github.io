---
layout: default
title: Blog
---
<div class="blurb">
  <ul class="posts">
    {% for post in site.posts %}
      <li>
        <div class="post-item">
          <a href="{{ post.url }}">{{ post.title }}</a>
          <span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span>
        </div>
        <p>{{ post.snippet }}</p>
      </li>
    {% endfor %}
  </ul>
</div>
